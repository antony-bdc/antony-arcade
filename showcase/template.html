<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games · Antony BDC</title>
<meta name="description" content="Browser games I built. Each one runs directly in the browser, no install.">
<meta name="color-scheme" content="light dark">
<link rel="preload" href="assets/inter-tight-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Inter Tight";font-weight:400;font-display:swap;src:url(assets/inter-tight-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Inter Tight";font-weight:600;font-display:swap;src:url(assets/inter-tight-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-display:swap;src:url(assets/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:700;font-display:swap;src:url(assets/jetbrains-mono-latin-700-normal.woff2) format("woff2")}
:root{--bg:#fafaf9;--fg:#0c0c0d;--muted:#6b6b70;--line:#e4e4e2;--tile:#0c0c0d;--tile-fg:#fafaf9;
      --sans:"Inter Tight",ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0c;--fg:#f2f2f0;--muted:#8e8e93;--line:#232326;--tile:#f2f2f0;--tile-fg:#0b0b0c}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
a:focus-visible{outline:2px solid var(--fg);outline-offset:4px;border-radius:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:28px 0 0}
.mark{display:flex;align-items:baseline;gap:12px;text-decoration:none}
.mark b{font:700 22px/1 var(--mono);letter-spacing:-.04em}
.mark span{font-size:15px;color:var(--muted)}
.top nav{font:400 13px/1 var(--mono);color:var(--muted)}
.top nav a{text-decoration:none}
.top nav a:hover{color:var(--fg)}
.hero{padding:96px 0 72px;border-bottom:1px solid var(--line)}
h1{font:600 clamp(44px,8vw,96px)/.98 var(--sans);letter-spacing:-.04em;margin:0;max-width:11ch}
.lead{margin:26px 0 0;color:var(--muted);font-size:18px;max-width:46ch}

.game{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:48px;padding:56px 0;border-bottom:1px solid var(--line);align-items:center}
.game:nth-child(even) .visual{order:2}
.visual{display:block;aspect-ratio:16/9;background:var(--tile);border-radius:6px;overflow:hidden;position:relative}
.visual img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.visual .initial{position:absolute;inset:0;display:grid;place-items:center;font:600 clamp(96px,16vw,200px)/1 var(--sans);letter-spacing:-.06em;color:var(--tile-fg)}
@media (hover:hover){.game:hover .visual img{transform:scale(1.025)}}
.meta{display:flex;gap:18px;margin:0 0 14px;font:400 13px/1 var(--mono);color:var(--muted)}
h2{font:600 clamp(30px,3.6vw,44px)/1.05 var(--sans);letter-spacing:-.03em;margin:0}
h2 a{text-decoration:none}
.desc{margin:16px 0 0;font-size:17px;max-width:40ch}
.controls{margin:12px 0 0;font:400 13px/1.6 var(--mono);color:var(--muted)}
.tags{list-style:none;display:flex;flex-wrap:wrap;gap:8px 16px;margin:18px 0 0;padding:0;font:400 13px/1 var(--mono);color:var(--muted)}
.play{display:inline-flex;align-items:center;gap:6px;margin-top:28px;padding:13px 20px;border-radius:999px;background:var(--fg);color:var(--bg);
      font-weight:600;text-decoration:none;transition:transform .15s ease-out}
.play:active{transform:scale(.97)}
.empty{padding:56px 0;color:var(--muted)}
.foot{padding:56px 0 64px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
@media (max-width:760px){
  .wrap{padding:0 20px}
  .hero{padding:64px 0 48px}
  .game{grid-template-columns:1fr;gap:24px;padding:40px 0}
  .game:nth-child(even) .visual{order:0}
  .play{width:100%;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="mark" href="./"><b>a_</b><span>Games</span></a>
    <nav><a href="https://antonybdc.ch">antonybdc.ch</a></nav>
  </header>
  <section class="hero">
    <h1>Games that run in your browser.</h1>
    <p class="lead">{{COUNT}} games I built, each in plain HTML, CSS and JavaScript. Click one and play, nothing to install.</p>
  </section>
  <main>{{GAMES}}</main>
  <footer class="foot">
    <span>Every game is checked and published automatically by GitHub Actions.</span>
    <a href="{{REPO_URL}}">Source on GitHub</a>
  </footer>
</div>
</body>
</html>
