---
name: pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q
      - name: Validate games and build the site
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python -m showcase.build games site
      - name: Check HTML of the gallery
        run: npx --yes html-validate@9 site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only main is published; pull requests are validated but not deployed.
    if: github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
